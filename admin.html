<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人員與權限管理 - 交接班系統</title><style>body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f3f6fa;color:#172033}.wrap{max-width:1400px;margin:auto;padding:24px}.top{background:#fff;border-bottom:1px solid #e4e7ec;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:20px;margin:18px 0;box-shadow:0 2px 8px #00000008}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:#1769aa;color:#fff}.btn.secondary{background:#e9eef5;color:#26364a}.btn.danger{background:#d92d20}.row{display:flex;gap:10px;flex-wrap:wrap}.muted{color:#667085}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #eaecf0;text-align:left;vertical-align:top}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef4ff;font-size:12px;font-weight:700}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.top{padding:14px}}</style></head><body><header class="top"><b>👤 人員與權限管理</b><div class="row"><span id="me" class="muted"></span><button class="btn secondary" onclick="location.href='/'">返回系統</button><button class="btn secondary" onclick="logout()">登出</button></div></header><main class="wrap"><div id="msg" class="muted"></div><section id="formPanel" class="panel hidden"><h2 id="formTitle">新增使用者</h2><div class="grid"><div class="field"><label>帳號</label><input id="u_username"></div><div class="field"><label>姓名</label><input id="u_name"></div><div class="field"><label>職稱</label><input id="u_title" value="職員"></div><div class="field"><label>部門</label><select id="u_dept"></select></div><div class="field"><label>權限</label><select id="u_role"><option value="user">一般使用者</option><option value="admin">系統管理者</option></select></div><div class="field"><label>狀態</label><select id="u_active"><option value="1">啟用</option><option value="0">停用</option></select></div><div class="field"><label>密碼</label><input id="u_password" type="password"><div id="pwHint" class="muted" style="font-size:12px">新增時必填；編輯時留白代表不修改。</div></div></div><div class="row"><button class="btn" onclick="saveUser()">儲存</button><button class="btn secondary" onclick="cancelForm()">取消</button></div></section><section class="panel"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">使用者清單</h2><div class="muted">管理帳號、姓名、職稱、部門、權限與啟用狀態</div></div><button class="btn" onclick="newUser()">＋ 新增使用者</button></div><div style="overflow:auto;margin-top:15px"><table class="table"><thead><tr><th>帳號</th><th>姓名</th><th>職稱</th><th>部門</th><th>權限</th><th>狀態</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div></section></main><script>const DEPTS=['倉庫部','拍賣部','物流部','資訊部','水果組','蔬菜組'];let token=sessionStorage.getItem('handoverToken')||'',editingId=null,meData=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(token)opt.headers.Authorization='Bearer '+token;const r=await fetch('/api'+path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'系統錯誤');return d}async function boot(){try{const d=await api('/me');meData=d.user;if(meData.role!=='admin')throw Error('只有系統管理者可以使用此頁面');document.getElementById('me').textContent=`${meData.name}｜${meData.title}`;u_dept.innerHTML=DEPTS.map(d=>`<option>${d}</option>`).join('');await loadUsers()}catch(e){document.body.innerHTML=`<div style="padding:40px;font-family:Arial">${esc(e.message)}<br><br><a href="/">返回系統</a></div>`}}async function loadUsers(){const a=await api('/admin/users');users.innerHTML=a.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.name)}</td><td>${esc(u.title)}</td><td>${esc(u.dept)}</td><td><span class="badge">${u.role==='admin'?'系統管理者':'一般使用者'}</span></td><td>${u.active?'啟用':'停用'}</td><td><button class="btn secondary" onclick='editUser(${u.id})'>編輯</button></td></tr>`).join('')}function newUser(){editingId=null;formTitle.textContent='新增使用者';formPanel.classList.remove('hidden');u_username.disabled=false;u_username.value='';u_name.value='';u_title.value='職員';u_dept.value='倉庫部';u_role.value='user';u_active.value='1';u_password.value=''}async function editUser(id){const a=await api('/admin/users');const u=a.find(x=>x.id===id);editingId=id;formTitle.textContent='編輯使用者';formPanel.classList.remove('hidden');u_username.disabled=true;u_username.value=u.username;u_name.value=u.name;u_title.value=u.title;u_dept.value=u.dept;u_role.value=u.role;u_active.value=u.active?'1':'0';u_password.value=''}function cancelForm(){editingId=null;formPanel.classList.add('hidden')}async function saveUser(){try{const data={username:u_username.value.trim(),name:u_name.value.trim(),title:u_title.value.trim(),dept:u_dept.value,role:u_role.value,active:Number(u_active.value),password:u_password.value};if(!data.name||!data.title)return alert('姓名與職稱為必填');if(!editingId&&!data.username)return alert('帳號為必填');if(!editingId&&!data.password)return alert('新增使用者時密碼為必填');await api(editingId?'/admin/users/'+editingId:'/admin/users',{method:editingId?'PUT':'POST',body:JSON.stringify(data)});alert('使用者資料已儲存');cancelForm();await loadUsers()}catch(e){alert(e.message)}}function logout(){sessionStorage.removeItem('handoverToken');location.href='/'}boot();</script></body></html>
