<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人員與權限管理 - 交接班系統</title><style>body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f3f6fa;color:#172033}.wrap{max-width:1500px;margin:auto;padding:24px}.top{background:#fff;border-bottom:1px solid #e4e7ec;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.panel,.editPanel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:20px;margin:18px 0;box-shadow:0 2px 8px #00000008}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:#1769aa;color:#fff}.btn.secondary{background:#e9eef5;color:#26364a}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#667085}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px;border-bottom:1px solid #eaecf0;text-align:left;vertical-align:top}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef4ff;font-size:12px;font-weight:700}.notice{padding:12px;border-radius:10px;background:#f8fafc;margin:8px 0;line-height:1.6}.result{white-space:pre-wrap;line-height:1.7;margin-top:12px}.perm{display:flex;gap:18px;flex-wrap:wrap}.perm label{display:flex;gap:8px;align-items:center;background:#f8fafc;border:1px solid #eaecf0;border-radius:9px;padding:10px 12px}.editRow{display:none;background:#f8fafc}.editRow.open{display:table-row}.editRow td{padding:0}.editPanel{margin:10px;padding:18px;border:1px solid #dbe2ea;box-shadow:none}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.top{padding:14px;gap:10px;flex-wrap:wrap}}</style></head><body><header class="top"><b>👤 人員與權限管理</b><div class="row"><span id="me" class="muted"></span><button class="btn secondary" onclick="location.href='/'">返回系統</button><button class="btn secondary" onclick="logout()">登出</button></div></header><main class="wrap"><section class="panel"><h2 style="margin-top:0">📥 Excel 批次匯入人員</h2><div class="notice">Excel 第一個工作表使用四個欄位：<b>部門名稱</b>、<b>員工工號(帳號)</b>、<b>中文姓名</b>、<b>職務名稱</b>。部門與職務名稱會原樣建立。新匯入人員預設為一般使用者、啟用、初始密碼 <b>1234</b>，且不自動取得貢獻度／市場行情權限。</div><div class="row"><input id="excelFile" type="file" accept=".xlsx,.xls,.csv"><button class="btn" onclick="importExcel()">匯入 Excel</button><button class="btn secondary" onclick="downloadTemplate()">下載範本</button></div><div id="importResult" class="result"></div></section><section id="createPanel" class="panel hidden"><h2 style="margin-top:0">新增使用者</h2><div id="createForm"></div></section><section class="panel"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">使用者清單</h2><div class="muted">點擊「編輯」後，編輯區會直接展開在該名人員下方。</div></div><button class="btn" onclick="newUser()">＋ 新增使用者</button></div><div style="overflow:auto;margin-top:15px"><table class="table"><thead><tr><th>帳號</th><th>姓名</th><th>職務名稱</th><th>部門名稱</th><th>系統權限</th><th>狀態</th><th>功能權限</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div></section></main><script>let token=sessionStorage.getItem('handoverToken')||'',meData=null,currentUsers=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(token)opt.headers.Authorization='Bearer '+token;const r=await fetch('/api'+path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'系統錯誤');return d}function formHtml(prefix,u={},isEdit=false){return `<div class="grid"><div class="field"><label>帳號／員工工號</label><input id="${prefix}_username" value="${esc(u.username||'')}" ${isEdit?'disabled':''}></div><div class="field"><label>中文姓名</label><input id="${prefix}_name" value="${esc(u.name||'')}"></div><div class="field"><label>職務名稱</label><input id="${prefix}_title" value="${esc(u.title||'')}"></div><div class="field"><label>部門名稱</label><input id="${prefix}_dept" value="${esc(u.dept||'')}" placeholder="直接輸入實際部門名稱"></div><div class="field"><label>系統權限</label><select id="${prefix}_role"><option value="user" ${u.role!=='admin'?'selected':''}>一般使用者</option><option value="admin" ${u.role==='admin'?'selected':''}>系統管理者</option></select></div><div class="field"><label>狀態</label><select id="${prefix}_active"><option value="1" ${u.active!==0?'selected':''}>啟用</option><option value="0" ${u.active===0?'selected':''}>停用</option></select></div><div class="field"><label>密碼</label><input id="${prefix}_password" type="password" value="${isEdit?'':'1234'}" placeholder="${isEdit?'留白代表不修改':'預設 1234'}"></div></div><div class="field"><label>功能權限</label><div class="perm"><label><input id="${prefix}_contribution" type="checkbox" ${u.canContribution?'checked':''}> 本日貢獻度</label><label><input id="${prefix}_market" type="checkbox" ${u.canMarket?'checked':''}> 各主要批發市場交易行情</label></div></div><div class="row"><button class="btn" onclick="${isEdit?`saveEdit(${u.id})`:'saveCreate()'}">儲存</button><button class="btn secondary" onclick="${isEdit?`closeEdit(${u.id})`:'cancelCreate()'}">取消</button></div>`}
async function boot(){try{const d=await api('/me');meData=d.user;if(meData.role!=='admin')throw Error('只有系統管理者可以使用此頁面');document.getElementById('me').textContent=`${meData.name}｜${meData.title}`;await loadUsers()}catch(e){document.body.innerHTML=`<div style="padding:40px;font-family:Arial">${esc(e.message)}<br><br><a href="/">返回系統</a></div>`}}
async function loadUsers(){currentUsers=await api('/admin/users');document.getElementById('users').innerHTML=currentUsers.map(u=>`<tr id="row_${u.id}"><td>${esc(u.username)}</td><td>${esc(u.name)}</td><td>${esc(u.title)}</td><td>${esc(u.dept)}</td><td><span class="badge">${u.role==='admin'?'系統管理者':'一般使用者'}</span></td><td>${u.active?'啟用':'停用'}</td><td>${u.canContribution?'貢獻度 ':''}${u.canMarket?'行情':''}</td><td><button class="btn secondary" onclick="toggleEdit(${u.id})">編輯</button></td></tr><tr id="edit_${u.id}" class="editRow"><td colspan="8"><div class="editPanel" id="editPanel_${u.id}"></div></td></tr>`).join('')}
function toggleEdit(id){const row=document.getElementById('edit_'+id);if(row.classList.contains('open')){row.classList.remove('open');return}const u=currentUsers.find(x=>x.id===id);if(!u)return;document.querySelectorAll('.editRow.open').forEach(x=>x.classList.remove('open'));document.getElementById('editPanel_'+id).innerHTML=formHtml('edit',u,true);row.classList.add('open');row.scrollIntoView({behavior:'smooth',block:'nearest'})}
function closeEdit(id){document.getElementById('edit_'+id)?.classList.remove('open')}
async function saveEdit(id){try{const data={name:document.getElementById('edit_name').value.trim(),title:document.getElementById('edit_title').value.trim(),dept:document.getElementById('edit_dept').value.trim(),role:document.getElementById('edit_role').value,active:Number(document.getElementById('edit_active').value),password:document.getElementById('edit_password').value,canContribution:document.getElementById('edit_contribution').checked,canMarket:document.getElementById('edit_market').checked};await api('/admin/users/'+id,{method:'PUT',body:JSON.stringify(data)});alert('使用者資料已更新');closeEdit(id);await loadUsers()}catch(e){alert(e.message)}}
function newUser(){document.getElementById('createForm').innerHTML=formHtml('create',{role:'user',active:1,canContribution:false,canMarket:false},false);document.getElementById('createPanel').classList.remove('hidden');document.getElementById('createPanel').scrollIntoView({behavior:'smooth',block:'start'})}function cancelCreate(){document.getElementById('createPanel').classList.add('hidden')}
async function saveCreate(){try{const data={username:document.getElementById('create_username').value.trim(),name:document.getElementById('create_name').value.trim(),title:document.getElementById('create_title').value.trim(),dept:document.getElementById('create_dept').value.trim(),role:document.getElementById('create_role').value,active:Number(document.getElementById('create_active').value),password:document.getElementById('create_password').value||'1234',canContribution:document.getElementById('create_contribution').checked,canMarket:document.getElementById('create_market').checked};if(!data.username||!data.name||!data.title||!data.dept)return alert('帳號、姓名、職務名稱與部門名稱為必填');await api('/admin/users',{method:'POST',body:JSON.stringify(data)});alert('使用者已建立');cancelCreate();await loadUsers()}catch(e){alert(e.message)}}
async function importExcel(){const f=document.getElementById('excelFile').files[0];if(!f)return alert('請先選擇 Excel 檔案');if(!/\.(xlsx|xls|csv)$/i.test(f.name))return alert('請選擇 .xlsx、.xls 或 .csv 檔案');const fd=new FormData();fd.append('file',f);try{const r=await fetch('/api/admin/users/import',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'匯入失敗');let text=`${d.message}\n工作表：${d.sheet}\n總筆數：${d.total}\n新增：${d.created}\n略過：${d.skipped}\n初始密碼：${d.passwordDefault}`;if(d.duplicates?.length)text+='\n\n略過項目：\n'+d.duplicates.join('\n');if(d.errors?.length)text+='\n\n錯誤項目：\n'+d.errors.join('\n');document.getElementById('importResult').textContent=text;await loadUsers()}catch(e){alert(e.message)}}
function downloadTemplate(){const rows=[['部門名稱','員工工號(帳號)','中文姓名','職務名稱'],['範例部門','A001','王小明','組員'],['範例部門','A002','陳小華','課員']];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='交接班系統_人員匯入範本.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}function logout(){sessionStorage.removeItem('handoverToken');location.href='/'}boot();</script></body></html>
