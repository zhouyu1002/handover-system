<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>作業平台 - 交接班與巡檢系統</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f3f6fa;color:#172033}.hidden{display:none!important}.wrap{min-height:100vh;background:linear-gradient(135deg,#102a43,#1769aa)}.box{width:min(1050px,92vw);margin:auto;padding:70px 0}.login,.portal{background:#fff;border-radius:20px;padding:34px;box-shadow:0 20px 55px #0004}.brand{font-size:30px;font-weight:800}.muted{color:#667085}.field{margin:16px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:#1769aa;color:#fff}.btn.secondary{background:#e9eef5;color:#26364a}.err{color:#b42318;margin-top:12px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.card{border:1px solid #e4e7ec;border-radius:16px;padding:24px;cursor:pointer;transition:.15s;background:#fff}.card:hover{transform:translateY(-3px);box-shadow:0 10px 25px #0001}.icon{font-size:40px}.card h2{margin:12px 0 8px}.tag{display:inline-block;padding:5px 9px;background:#eef4ff;color:#175cd3;border-radius:999px;font-size:12px;font-weight:700}@media(max-width:800px){.box{padding:25px 0}.cards{grid-template-columns:1fr}}</style></head><body><div class="wrap"><main class="box"><section id="login" class="login"><div class="brand">📋 蔬果拍賣市場作業平台</div><div class="muted" style="margin-top:7px">交接班 × 巡檢 × 系統管理</div><div class="field"><label>帳號／員工工號</label><input id="username" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" style="width:100%" onclick="login()">登入</button><div id="err" class="err"></div></section><section id="portal" class="portal hidden"><div class="top"><div><div class="brand">工作入口</div><div id="userInfo" class="muted"></div></div><button class="btn secondary" onclick="logout()">登出</button></div><div class="cards" id="cards"></div></section></main></div><script>let token=sessionStorage.getItem('handoverToken')||'',me=null;async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(token)opt.headers.Authorization='Bearer '+token;const r=await fetch('/api'+path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'系統錯誤');return d}async function login(){err.textContent='';try{const d=await api('/login',{method:'POST',body:JSON.stringify({username:username.value.trim(),password:password.value})});token=d.token;sessionStorage.setItem('handoverToken',token);me=d.user;render()}catch(e){err.textContent=e.message}}async function boot(){if(!token)return;try{const d=await api('/me');me=d.user;render()}catch(e){sessionStorage.removeItem('handoverToken');token=''}}function render(){loginSection=false;document.getElementById('login').classList.add('hidden');document.getElementById('portal').classList.remove('hidden');document.getElementById('userInfo').textContent=`${me.name}｜${me.title}｜${me.dept}`;const canInspect=me.role==='admin'||me.canInspection;cards.innerHTML=`<div class="card" onclick="go('/?app=handover')"><div class="icon">📝</div><h2>交接班系統</h2><div class="muted">早班／午班／夜班、交接通知與交接紀錄</div><p><span class="tag">可使用</span></p></div>`+(canInspect?`<div class="card" onclick="go('/inspection.html')"><div class="icon">📸</div><h2>巡檢系統</h2><div class="muted">設備巡檢、拍照打卡、異常紀錄</div><p><span class="tag">已授權</span></p></div>`:'')+(me.role==='admin'?`<div class="card" onclick="go('/system-admin.html')"><div class="icon">⚙️</div><h2>系統管理</h2><div class="muted">人員、權限、巡檢點與系統設定</div><p><span class="tag">管理者專用</span></p></div>`:'')}function go(url){location.href=url}function logout(){sessionStorage.removeItem('handoverToken');location.reload()}document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('login')&&!document.getElementById('login').classList.contains('hidden'))login()});boot();</script></body></html>
