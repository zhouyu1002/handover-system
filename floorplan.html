<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巡檢圖面</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#eef2f6;color:#172033}.top{height:64px;background:#fff;border-bottom:1px solid #dfe3e8;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}.wrap{padding:18px;display:grid;grid-template-columns:320px 1fr;gap:16px}.panel{background:#fff;border:1px solid #dfe3e8;border-radius:12px;padding:16px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;background:#1769aa;color:#fff}.btn.secondary{background:#e9eef5;color:#26364a}.muted{color:#667085;font-size:13px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border:1px solid #ccd3da;border-radius:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.canvas{height:calc(100vh - 145px);min-height:500px;border:1px solid #ccd3da;border-radius:10px;overflow:hidden;background:#253142;position:relative}.stage{position:absolute;left:50%;top:50%;transform-origin:0 0;user-select:none}.stage img,.stage iframe{display:block;border:0;background:#fff}.marker{position:absolute;width:22px;height:22px;border-radius:50%;background:#e5484d;border:3px solid #fff;box-shadow:0 2px 8px #0006;transform:translate(-50%,-50%);cursor:pointer}.marker span{position:absolute;top:24px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;border:1px solid #dfe3e8;border-radius:6px;padding:3px 6px;font-size:12px}.list{max-height:55vh;overflow:auto}.item{padding:10px;border:1px solid #e6e9ee;border-radius:8px;margin:8px 0;cursor:pointer}.item:hover{background:#f7f9fb}.notice{padding:10px;border-radius:8px;background:#f8fafc;margin:8px 0;font-size:13px}@media(max-width:900px){.wrap{grid-template-columns:1fr}.canvas{height:65vh}}</style></head><body><header class="top"><b>🗺️ 巡檢圖面</b><div><button class="btn secondary" onclick="location.href='/inspection.html'">回巡檢系統</button></div></header><div class="wrap"><aside><div class="panel"><h2 style="margin-top:0">圖面匯入</h2><div class="notice">支援 PDF、PNG、JPG、WEBP、SVG、DXF。DWG 可先保存檔案，但瀏覽器無法直接原生解析 DWG。</div><div class="field"><label>選擇圖面檔案</label><input id="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.svg,.dxf,.dwg"></div><button class="btn" onclick="importPlan()">匯入圖面</button><div id="msg" class="muted" style="margin-top:8px"></div></div><div class="panel" style="margin-top:16px"><h3 style="margin-top:0">巡檢點</h3><div class="muted">在圖面上點擊位置，再輸入巡檢點名稱。</div><div class="field"><input id="markerName" placeholder="例如：水果冷藏庫 A01"></div><button class="btn secondary" onclick="toggleMarkerMode()">📍 新增巡檢點</button><div id="markers" class="list"></div></div></aside><main><div class="panel"><div class="toolbar"><button class="btn secondary" onclick="zoom(1.2)">＋ 放大</button><button class="btn secondary" onclick="zoom(0.83)">－ 縮小</button><button class="btn secondary" onclick="resetView()">重設視角</button><button class="btn secondary" onclick="rotate(90)">↻ 旋轉 90°</button><button class="btn secondary" onclick="open360()">🌐 360°模式</button></div><div id="hint" class="muted" style="margin-bottom:8px">尚未匯入圖面。</div><div id="canvas" class="canvas"></div></div></main></div><script>const DB_NAME='handoverFloorplans',STORE='plans';let db,plan=null,scale=1,angle=0,ox=0,oy=0,dragging=false,lastX=0,lastY=0,markerMode=false,markers=[];const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}function put(v){return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}function all(){return new Promise((res,rej)=>{const r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function importPlan(){const f=$('file').files[0];if(!f)return alert('請先選擇圖面檔案');const ext=f.name.split('.').pop().toLowerCase();const buf=await f.arrayBuffer();let data={name:f.name,type:ext,size:f.size,createdAt:new Date().toISOString(),markers:[]};if(ext==='pdf'||['png','jpg','jpeg','webp','svg'].includes(ext)){data.url=URL.createObjectURL(new Blob([buf],{type:f.type||'application/octet-stream'}))}else if(ext==='dxf'){data.text=new TextDecoder('utf-8').decode(buf)}else{data.blob=new Blob([buf],{type:f.type||'application/octet-stream'});data.url=URL.createObjectURL(data.blob)}await put(data);$('msg').textContent='圖面已匯入';await loadPlan(data)}async function loadSaved(){await openDB();const a=await all();renderList(a);if(a.length)loadPlan(a[a.length-1])}function renderList(a){$('markers').innerHTML=a.map((x,i)=>`<div class="item" onclick="loadPlanById(${x.id})"><b>${esc(x.name)}</b><br><span class="muted">${x.type.toUpperCase()}｜${new Date(x.createdAt).toLocaleString('zh-TW')}</span></div>`).join('')||'<div class="muted">尚未匯入圖面</div>'}async function loadPlanById(id){const a=await all();const x=a.find(v=>v.id===id);if(x)loadPlan(x)}function loadPlan(x){plan=x;markers=plan.markers||[];scale=1;angle=0;ox=0;oy=0;render();renderMarkers();$('hint').textContent=`目前圖面：${plan.name}｜滑鼠滾輪縮放、拖曳平移`}$('canvas').addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:0.9)},{passive:false});$('canvas').addEventListener('mousedown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});window.addEventListener('mouseup',()=>dragging=false);window.addEventListener('mousemove',e=>{if(!dragging)return;ox+=e.clientX-lastX;oy+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;render()});$('canvas').addEventListener('click',e=>{if(!markerMode||!plan)return;const r=$('canvas').getBoundingClientRect();const x=(e.clientX-r.left-ox)/scale,y=(e.clientY-r.top-oy)/scale;const name=$('markerName').value.trim();if(!name)return alert('請先輸入巡檢點名稱');markers.push({name,x,y});plan.markers=markers;put(plan);markerMode=false;renderMarkers()});function render(){if(!plan)return;const c=$('canvas');c.innerHTML='<div id="stage" class="stage"></div>';const st=$('stage');st.style.transform=`translate(${ox}px,${oy}px) scale(${scale}) rotate(${angle}deg)`;if(plan.type==='pdf'){st.innerHTML=`<iframe src="${plan.url}" style="width:1000px;height:720px"></iframe>`}else if(['png','jpg','jpeg','webp','svg'].includes(plan.type)){st.innerHTML=`<img src="${plan.url}" style="max-width:none;width:1200px">`}else if(plan.type==='dxf'){st.innerHTML=`<pre style="width:1200px;height:720px;background:#fff;color:#111;padding:20px;white-space:pre;overflow:auto">DXF 已匯入。此版先提供原始內容檢視，下一版可加入 DXF 幾何圖形解析器。</pre>`}else{st.innerHTML='<div style="width:800px;height:500px;background:#fff;padding:30px">DWG 已匯入保存，但目前瀏覽器不直接解析 DWG。請先轉成 PDF 或 DXF。</div>'}renderMarkers()}function renderMarkers(){if(!$('stage'))return;document.querySelectorAll('.marker').forEach(x=>x.remove());const st=$('stage');markers.forEach((m,i)=>{const d=document.createElement('div');d.className='marker';d.style.left=m.x+'px';d.style.top=m.y+'px';d.title=m.name;d.innerHTML='<span>'+esc(m.name)+'</span>';d.onclick=e=>{e.stopPropagation();alert(m.name+'\n可在此處再連結到實際巡檢點')};st.appendChild(d)});$('markers').innerHTML=markers.map((m,i)=>`<div class="item"><b>${esc(m.name)}</b><br><span class="muted">X=${Math.round(m.x)} / Y=${Math.round(m.y)}</span></div>`).join('')||'<div class="muted">尚未建立巡檢點</div>'}function toggleMarkerMode(){markerMode=!markerMode;$('hint').textContent=markerMode?'請在圖面上點擊要放置巡檢點的位置':''}function zoom(f){scale=Math.min(5,Math.max(.2,scale*f));render()}function rotate(a){angle=(angle+a)%360;render()}function resetView(){scale=1;angle=0;ox=0;oy=0;render()}function open360(){if(!plan)return alert('請先匯入圖片');const url=plan.url;const w=window.open('about:blank','_blank');w.document.write(`<html><body style="margin:0;background:#000;overflow:hidden"><img src="${url}" style="height:100vh;width:100vw;object-fit:cover;cursor:grab" id="p"><script>let x=0,d=false,l=0;const p=document.getElementById('p');document.body.onmousedown=e=>{d=true;l=e.clientX};document.body.onmouseup=()=>d=false;document.body.onmousemove=e=>{if(d){x+=e.clientX-l;l=e.clientX;p.style.transform='translateX('+x+'px) scale(1.1)'}}</script></body></html>`);w.document.close()}loadSaved();</script></body></html>
