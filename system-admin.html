<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系統管理 - 交接班系統</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f3f6fa;color:#172033}.top{background:#fff;border-bottom:1px solid #e4e7ec;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.wrap{max-width:1500px;margin:auto;padding:24px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:0;border-radius:10px;padding:11px 15px;background:#e9eef5;font-weight:700;cursor:pointer}.tab.active{background:#1769aa;color:#fff}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:20px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:#1769aa;color:#fff}.btn.secondary{background:#e9eef5;color:#26364a}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eaecf0;text-align:left;vertical-align:top}.inlineEdit{background:#f8fafc}.perm{display:flex;gap:18px;flex-wrap:wrap}.perm label{font-weight:700}.muted{color:#667085}.notice{padding:12px;border-radius:10px;background:#f8fafc;margin:10px 0}.hidden{display:none!important}@media(max-width:900px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><header class="top"><div><b>⚙️ 系統管理</b><div id="me" class="muted"></div></div><div class="row"><button class="btn secondary" onclick="location.href='/portal.html'">返回作業平台</button><button class="btn secondary" onclick="logout()">登出</button></div></header><main class="wrap"><div class="tabs"><button id="tabUsers" class="tab active" onclick="showTab('users')">👥 人員與權限</button><button id="tabInspect" class="tab" onclick="showTab('inspection')">📸 巡檢點設定</button></div><section id="usersPanel"><section class="panel"><h2 style="margin-top:0">📥 Excel 批次匯入人員</h2><div class="notice">欄位：部門名稱、員工工號(帳號)、中文姓名、職務名稱。新匯入人員預設：一般使用者、啟用、密碼 1234，巡檢／貢獻度／市場行情權限預設關閉。</div><div class="row"><input id="excelFile" type="file" accept=".xlsx,.xls,.csv"><button class="btn" onclick="importExcel()">匯入 Excel</button><button class="btn secondary" onclick="downloadTemplate()">下載範本</button></div><div id="importResult" class="muted" style="white-space:pre-wrap;margin-top:10px"></div></section><section class="panel"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">使用者清單</h2><div class="muted">編輯區會直接展開在該人員下方</div></div><button class="btn" onclick="newUser()">＋ 新增使用者</button></div><div style="overflow:auto;margin-top:14px"><table class="table"><thead><tr><th>帳號</th><th>姓名</th><th>職務</th><th>部門</th><th>系統權限</th><th>功能權限</th><th>狀態</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></div></section></section><section id="inspectionPanel" class="hidden"><section class="panel"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">📸 巡檢點設定</h2><div class="muted">建立實際要巡檢的設備、位置與說明</div></div><button class="btn" onclick="newCheckpoint()">＋ 新增巡檢點</button></div><div id="checkpointForm" class="hidden" style="margin-top:15px"></div><div style="overflow:auto;margin-top:15px"><table class="table"><thead><tr><th>部門</th><th>巡檢設備／項目</th><th>位置</th><th>說明</th><th>狀態</th><th>操作</th></tr></thead><tbody id="checkpoints"></tbody></table></div></section></section></main><script>let token=sessionStorage.getItem('handoverToken')||'',editingId=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(token)opt.headers.Authorization='Bearer '+token;const r=await fetch('/api'+path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'系統錯誤');return d}async function boot(){try{const d=await api('/me');if(d.user.role!=='admin')throw Error('只有系統管理者可以使用此頁面');me.textContent=`${d.user.name}｜${d.user.title}`;await loadUsers();await loadCheckpoints()}catch(e){document.body.innerHTML=`<div style="padding:40px">${esc(e.message)}<br><br><a href="/portal.html">返回作業平台</a></div>`}}function showTab(t){const usersTab=t==='users';usersPanel.classList.toggle('hidden',!usersTab);inspectionPanel.classList.toggle('hidden',usersTab);tabUsers.classList.toggle('active',usersTab);tabInspect.classList.toggle('active',!usersTab)}async function loadUsers(){const a=await api('/system/users');users.innerHTML=a.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.name)}</td><td>${esc(u.title)}</td><td>${esc(u.dept)}</td><td>${u.role==='admin'?'系統管理者':'一般使用者'}</td><td>${u.canInspection?'📸 巡檢 ':''}${u.canContribution?'📈 貢獻度 ':''}${u.canMarket?'📊 市場行情':''||'—'}</td><td>${u.active?'啟用':'停用'}</td><td><button class="btn secondary" onclick="toggleEdit(${u.id})">編輯</button></td></tr>`).join('')}function toggleEdit(id){const row=document.getElementById('edit_'+id);if(row){row.remove();return}api('/system/users').then(a=>{const u=a.find(x=>x.id===id);const tr=document.createElement('tr');tr.id='edit_'+id;tr.className='inlineEdit';tr.innerHTML=`<td colspan="8"><div class="grid"><div class="field"><label>帳號</label><input disabled value="${esc(u.username)}"></div><div class="field"><label>姓名</label><input id="n_${id}" value="${esc(u.name)}"></div><div class="field"><label>職務</label><input id="t_${id}" value="${esc(u.title)}"></div><div class="field"><label>部門</label><input id="d_${id}" value="${esc(u.dept)}"></div><div class="field"><label>系統權限</label><select id="r_${id}"><option value="user" ${u.role==='user'?'selected':''}>一般使用者</option><option value="admin" ${u.role==='admin'?'selected':''}>系統管理者</option></select></div><div class="field"><label>狀態</label><select id="a_${id}"><option value="1" ${u.active?'selected':''}>啟用</option><option value="0" ${!u.active?'selected':''}>停用</option></select></div></div><div class="perm"><label><input type="checkbox" id="i_${id}" ${u.canInspection?'checked':''}> 巡檢系統</label><label><input type="checkbox" id="c_${id}" ${u.canContribution?'checked':''}> 本日貢獻度</label><label><input type="checkbox" id="m_${id}" ${u.canMarket?'checked':''}> 市場行情</label></div><div class="row" style="margin-top:14px"><input id="p_${id}" type="password" placeholder="新密碼（留白不修改）"><button class="btn" onclick="saveUser(${id})">儲存</button><button class="btn secondary" onclick="document.getElementById('edit_${id}').remove()">取消</button></div></td>`;document.getElementById('edit_'+id)?.remove();const trs=users.querySelectorAll('tr');for(const x of trs){if(x.children[0]?.textContent===u.username){x.after(tr);break}}})}async function saveUser(id){try{const body={name:document.getElementById('n_'+id).value,title:document.getElementById('t_'+id).value,dept:document.getElementById('d_'+id).value,role:document.getElementById('r_'+id).value,active:Number(document.getElementById('a_'+id).value),canInspection:document.getElementById('i_'+id).checked,canContribution:document.getElementById('c_'+id).checked,canMarket:document.getElementById('m_'+id).checked,password:document.getElementById('p_'+id).value};await api('/system/users/'+id,{method:'PUT',body:JSON.stringify(body)});alert('使用者資料已更新');await loadUsers()}catch(e){alert(e.message)}}function newUser(){const id='new';formPanel.innerHTML=`<section class="panel"><h2>新增使用者</h2><div class="grid"><div class="field"><label>帳號／員工工號</label><input id="nu"></div><div class="field"><label>姓名</label><input id="nn"></div><div class="field"><label>職務名稱</label><input id="nt"></div><div class="field"><label>部門名稱</label><input id="nd"></div><div class="field"><label>系統權限</label><select id="nr"><option value="user">一般使用者</option><option value="admin">系統管理者</option></select></div></div><div class="perm"><label><input type="checkbox" id="ni"> 巡檢系統</label><label><input type="checkbox" id="nc"> 本日貢獻度</label><label><input type="checkbox" id="nm"> 市場行情</label></div><div class="row" style="margin-top:14px"><button class="btn" onclick="createUser()">建立（初始密碼 1234）</button><button class="btn secondary" onclick="formPanel.classList.add('hidden')">取消</button></div></section>`;formPanel.classList.remove('hidden')}async function createUser(){try{await api('/system/users',{method:'POST',body:JSON.stringify({username:nu.value,name:nn.value,title:nt.value,dept:nd.value,role:nr.value,password:'1234',canInspection:ni.checked,canContribution:nc.checked,canMarket:nm.checked,active:1})});formPanel.classList.add('hidden');await loadUsers()}catch(e){alert(e.message)}}async function importExcel(){const f=excelFile.files[0];if(!f)return alert('請先選擇 Excel');const fd=new FormData();fd.append('file',f);try{const r=await fetch('/api/admin/users/import',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'匯入失敗');importResult.textContent=`${d.message}\n新增：${d.created}｜略過：${d.skipped}｜初始密碼：${d.passwordDefault}`;await loadUsers()}catch(e){alert(e.message)}}function downloadTemplate(){const rows=[['部門名稱','員工工號(帳號)','中文姓名','職務名稱'],['範例部門','A001','王小明','組員'],['範例部門','A002','陳小華','課員']];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='交接班系統_人員匯入範本.csv';a.click()}async function loadCheckpoints(){const a=await api('/system/inspection/checkpoints');checkpoints.innerHTML=a.map(c=>`<tr><td>${esc(c.dept)}</td><td>${esc(c.name)}</td><td>${esc(c.location||'')}</td><td>${esc(c.description||'')}</td><td>${c.active?'啟用':'停用'}</td><td><button class="btn secondary" onclick='editCheckpoint(${JSON.stringify(c)})'>編輯</button></td></tr>`).join('')}function newCheckpoint(){editCheckpoint({id:0,dept:'',name:'',location:'',description:'',active:1})}function editCheckpoint(c){checkpointForm.innerHTML=`<div class="grid"><div class="field"><label>部門名稱</label><input id="cd" value="${esc(c.dept)}"></div><div class="field"><label>巡檢設備／項目</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>位置</label><input id="cl" value="${esc(c.location||'')}"></div><div class="field"><label>狀態</label><select id="ca"><option value="1" ${c.active?'selected':''}>啟用</option><option value="0" ${!c.active?'selected':''}>停用</option></select></div><div class="field" style="grid-column:1/-1"><label>巡檢說明</label><input id="cx" value="${esc(c.description||'')}"></div></div><div class="row"><button class="btn" onclick="saveCheckpoint(${c.id})">儲存</button><button class="btn secondary" onclick="checkpointForm.classList.add('hidden')">取消</button></div>`;checkpointForm.classList.remove('hidden')}async function saveCheckpoint(id){try{await api(id?'/system/inspection/checkpoints/'+id:'/system/inspection/checkpoints',{method:id?'PUT':'POST',body:JSON.stringify({dept:cd.value,name:cn.value,location:cl.value,description:cx.value,active:Number(ca.value)})});checkpointForm.classList.add('hidden');await loadCheckpoints()}catch(e){alert(e.message)}}function logout(){sessionStorage.removeItem('handoverToken');location.href='/portal.html'}boot();</script></body></html>
