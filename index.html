<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>交接班系統</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f3f6fa;color:#172033}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f2747,#1d5d8f)}.card{background:#fff;border-radius:18px;padding:34px;width:min(470px,92vw);box-shadow:0 18px 50px #0003}.brand{font-size:28px;font-weight:800;margin-bottom:8px}.muted{color:#667085}.field{margin:18px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#1769aa;color:#fff}.btn.secondary{background:#e9eef5;color:#26364a}.btn.danger{background:#d92d20}.top{height:68px;background:#fff;border-bottom:1px solid #e4e7ec;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.top-right{display:flex;align-items:center;gap:12px}.notify{position:relative}.bell{border:0;background:#f2f4f7;border-radius:10px;padding:9px 12px;font-size:18px;cursor:pointer;position:relative}.count{position:absolute;right:-4px;top:-5px;background:#d92d20;color:white;border-radius:99px;min-width:20px;height:20px;font-size:11px;display:grid;place-items:center;font-weight:800}.dropdown{position:absolute;right:0;top:45px;width:360px;max-width:90vw;background:white;border:1px solid #e4e7ec;border-radius:12px;box-shadow:0 12px 35px #0002;padding:10px}.notice-item{padding:12px;border-bottom:1px solid #eaecf0;cursor:pointer}.notice-item:last-child{border-bottom:0}.notice-item.unread{background:#eef6ff}.notice-title{font-weight:800}.notice-time{font-size:12px;color:#667085;margin-top:4px}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 68px)}aside{background:#102a43;color:#fff;padding:20px 14px}.nav{padding:12px 14px;border-radius:9px;margin:5px 0;cursor:pointer}.nav.active,.nav:hover{background:#1e4f78}.main{padding:26px;max-width:1400px;width:100%;margin:auto}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:20px;box-shadow:0 2px 8px #00000008}.stat{font-size:30px;font-weight:800;margin-top:6px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;border-bottom:1px solid #eaecf0;text-align:left;vertical-align:top}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#eaf2ff;color:#175cd3;font-size:12px;font-weight:700}.badge.green{background:#ecfdf3;color:#027a48}.badge.orange{background:#fff7e6;color:#b54708}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.notice{padding:12px;border-radius:10px;background:#fff7e6;color:#8a5b00;margin-bottom:15px}.login-help{font-size:12px;line-height:1.7;margin-top:16px;padding:12px;background:#f8fafc;border-radius:10px}.person-card{display:flex;justify-content:space-between;align-items:center;padding:14px;border:1px solid #eaecf0;border-radius:10px;margin:8px 0}.role{font-size:12px;color:#667085}.dept-title{font-size:18px;font-weight:800;margin:22px 0 8px}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.main{padding:16px}.top{padding:0 16px}.user-label{display:none}}
</style>
</head>
<body>
<section id="login" class="login"><div class="card">
<div class="brand">📋 交接班系統</div><div class="muted">部門分流 × 三班制 × 人員交接 × 通知</div>
<div class="field"><label>帳號</label><input id="username" value="admin" autocomplete="username"></div>
<div class="field"><label>密碼</label><input id="password" type="password" value="admin123" autocomplete="current-password"></div>
<button class="btn" style="width:100%" onclick="login()">登入系統</button>
<div class="login-help"><b>管理者</b>：admin / admin123<br><b>部門舊版 Demo</b>：warehouse、auction、logistics、it / 1234<br><b>正式 Demo 人員帳號</b>：請使用下方「人員帳號」登入，例如 warehouse_mgr / 1234。</div>
</div></section>
<section id="app" class="hidden"><header class="top"><b>📋 交接班系統</b><div class="top-right"><div class="notify"><button class="bell" onclick="toggleNotifications()">🔔<span id="notifyCount" class="count hidden">0</span></button><div id="notifyPanel" class="dropdown hidden"></div></div><span id="userInfo" class="user-label"></span><button class="btn secondary" onclick="logout()">登出</button></div></header>
<div class="layout"><aside><div class="nav active" onclick="showPage('dashboard',this)">📊 儀表板</div><div class="nav" onclick="showPage('handover',this)">📝 新增交接</div><div class="nav" onclick="showPage('history',this)">🕘 交接紀錄</div><div id="peopleNav" class="nav" onclick="showPage('people',this)">👥 人員資料</div><div id="adminNav" class="nav hidden" onclick="showPage('admin',this)">⚙️ 管理者總覽</div></aside><main class="main"><div id="content"></div></main></div></section>
<script>
const DEPTS=['倉庫部','拍賣部','物流部','資訊部'];
const PEOPLE={
 '倉庫部':[{id:'warehouse_mgr',name:'王志明',title:'經理'},{id:'warehouse_1',name:'陳建宏',title:'職員'},{id:'warehouse_2',name:'林冠廷',title:'職員'}],
 '拍賣部':[{id:'auction_mgr',name:'李明哲',title:'經理'},{id:'auction_1',name:'張育誠',title:'職員'},{id:'auction_2',name:'黃俊豪',title:'職員'}],
 '物流部':[{id:'logistics_mgr',name:'林志宏',title:'經理'},{id:'logistics_1',name:'吳承翰',title:'職員'},{id:'logistics_2',name:'許家豪',title:'職員'}],
 '資訊部':[{id:'it_mgr',name:'周文傑',title:'經理'},{id:'it_1',name:'鄭宇翔',title:'職員'},{id:'it_2',name:'郭冠廷',title:'職員'}]
};
const USERS={admin:{name:'系統管理者',title:'管理者',role:'admin',dept:'全部部門'}};
DEPTS.forEach(d=>PEOPLE[d].forEach(p=>USERS[p.id]={...p,role:'user',dept:d}));
// 保留舊 Demo 帳號，預設登入該部門第一位經理
USERS.warehouse={...PEOPLE['倉庫部'][0],role:'user',dept:'倉庫部'};USERS.auction={...PEOPLE['拍賣部'][0],role:'user',dept:'拍賣部'};USERS.logistics={...PEOPLE['物流部'][0],role:'user',dept:'物流部'};USERS.it={...PEOPLE['資訊部'][0],role:'user',dept:'資訊部'};
const shifts=['早班','午班','夜班'];let current=null;
function db(){return JSON.parse(localStorage.getItem('handoverRecords')||'[]')}
function save(a){localStorage.setItem('handoverRecords',JSON.stringify(a))}
function notifications(){return JSON.parse(localStorage.getItem('handoverNotifications')||'[]')}
function saveNotifications(a){localStorage.setItem('handoverNotifications',JSON.stringify(a))}
function login(){let u=document.getElementById('username').value.trim(),p=document.getElementById('password').value,x=USERS[u];if(!x||((u==='admin'&&p!=='admin123')||(u!=='admin'&&p!=='1234'))){alert('帳號或密碼錯誤');return}current={username:u,...x};document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('adminNav').classList.toggle('hidden',current.role!=='admin');document.getElementById('userInfo').textContent=`${current.name}｜${current.title}｜${current.dept}`;updateNotifications();showPage('dashboard',document.querySelector('.nav'))}
function logout(){current=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function visible(){let a=db();return current.role==='admin'?a:a.filter(x=>x.dept===current.dept)}
function showPage(page,el){document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));if(el)el.classList.add('active');if(page==='dashboard')dashboard();if(page==='handover')handover();if(page==='history')history();if(page==='people')people();if(page==='admin')admin()}
function dashboard(){let a=visible(),today=new Date().toLocaleDateString('zh-TW'),mine=notifications().filter(n=>n.to===current.username&&!n.read);document.getElementById('content').innerHTML=`<div class="header"><div><h1>儀表板</h1><div class="muted">${current.role==='admin'?'管理者可查看全部部門':'目前顯示：'+current.dept}</div></div><button class="btn" onclick="handover()">＋ 新增交接</button></div><div class="grid"><div class="panel"><div class="muted">今日交接</div><div class="stat">${a.filter(x=>x.date===today).length}</div></div><div class="panel"><div class="muted">早班</div><div class="stat">${a.filter(x=>x.shift==='早班').length}</div></div><div class="panel"><div class="muted">待處理通知</div><div class="stat">${mine.length}</div></div></div><h2 style="margin-top:26px">最近交接</h2><div class="panel">${table(a.slice(-8).reverse())}</div>`}
function handover(){let defaultDept=current.role==='admin'?'倉庫部':current.dept;document.getElementById('content').innerHTML=`<div class="header"><div><h1>新增交接</h1><div class="muted">填寫本班重要事項並指定接班人</div></div></div><div class="panel"><div class="formgrid"><div class="field"><label>部門</label><select id="dept" onchange="refreshRecipients()" ${current.role==='admin'?'':'disabled'}>${DEPTS.map(d=>`<option ${d===defaultDept?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label>班別</label><select id="shift">${shifts.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field"><label>交接給</label><select id="recipient">${recipientOptions(defaultDept)}</select></div><div class="field"><label>交接人</label><input value="${esc(current.name)}（${esc(current.title)}）" disabled></div><div class="field full"><label>交接事項</label><textarea id="summary" rows="5" placeholder="例如：設備狀況、工作進度、異常事件、重要通知"></textarea></div><div class="field"><label>待辦事項</label><textarea id="todo" rows="4" placeholder="下一班需要處理的工作"></textarea></div><div class="field"><label>異常／注意事項</label><textarea id="issue" rows="4" placeholder="若無可填寫「無」"></textarea></div></div><div class="row"><button class="btn" onclick="submitHandover()">送出交接</button><button class="btn secondary" onclick="dashboard()">取消</button></div></div>`}
function recipientOptions(dept){return PEOPLE[dept].filter(p=>p.id!==current.username).map(p=>`<option value="${p.id}">${p.name}｜${p.title}</option>`).join('')}
function refreshRecipients(){document.getElementById('recipient').innerHTML=recipientOptions(document.getElementById('dept').value)}
function submitHandover(){let s=document.getElementById('summary').value.trim(),recipient=document.getElementById('recipient').value,dept=document.getElementById('dept').value;if(!s){alert('請填寫交接事項');return}let person=USERS[recipient],now=new Date(),record={id:Date.now(),date:now.toLocaleDateString('zh-TW'),time:now.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}),dept,shift:document.getElementById('shift').value,summary:s,todo:document.getElementById('todo').value.trim()||'無',issue:document.getElementById('issue').value.trim()||'無',author:current.name,authorTitle:current.title,authorId:current.username,recipient:person.name,recipientTitle:person.title,recipientId:person.id};let a=db();a.push(record);save(a);let ns=notifications();ns.push({id:Date.now()+1,to:person.id,from:current.username,fromName:current.name,dept,shift:record.shift,recordId:record.id,message:`${current.name} 已將 ${record.shift} 交接給您`,time:now.toLocaleString('zh-TW'),read:false});saveNotifications(ns);alert(`交接已送出給 ${person.name}（${person.title}）\n對方登入後右上角會收到 🔔 通知。`);dashboard()}
function table(a){if(!a.length)return '<div class="muted">目前沒有交接紀錄</div>';return `<div style="overflow:auto"><table class="table"><thead><tr><th>日期</th><th>部門</th><th>班別</th><th>交接人</th><th>接班人</th><th>交接事項</th><th>異常</th></tr></thead><tbody>${a.map(x=>`<tr><td>${x.date}<br>${x.time}</td><td>${esc(x.dept)}</td><td><span class="badge">${esc(x.shift)}</span></td><td>${esc(x.author)}<br><small>${esc(x.authorTitle||'')}</small></td><td>${esc(x.recipient||'未指定')}<br><small>${esc(x.recipientTitle||'')}</small></td><td>${esc(x.summary)}<br><small>待辦：${esc(x.todo)}</small></td><td>${esc(x.issue)}</td></tr>`).join('')}</tbody></table></div>`}
function history(){document.getElementById('content').innerHTML=`<div class="header"><div><h1>交接紀錄</h1><div class="muted">${current.role==='admin'?'全部部門':'僅顯示 '+current.dept}</div></div></div><div class="panel">${table(visible().reverse())}</div>`}
function people(){let html='<h1>人員資料</h1><div class="muted">各部門目前配置：1 名經理＋2 名職員</div>';DEPTS.forEach(d=>{html+=`<div class="dept-title">${d}</div><div class="panel">${PEOPLE[d].map(p=>`<div class="person-card"><div><b>${p.name}</b><div class="role">${p.title}｜帳號：${p.id}</div></div><span class="badge ${p.title==='經理'?'orange':'green'}">${p.title}</span></div>`).join('')}</div>`});document.getElementById('content').innerHTML=html}
function admin(){if(current.role!=='admin')return;let a=db();let stats=DEPTS.map(d=>`<div class="panel"><div class="muted">${d}</div><div class="stat">${a.filter(x=>x.dept===d).length}</div></div>`).join('');document.getElementById('content').innerHTML=`<div class="header"><div><h1>管理者總覽</h1><div class="muted">可跨部門查看所有交接資料與人員</div></div><button class="btn danger" onclick="clearData()">清除 Demo 資料</button></div><div class="grid">${stats}</div><h2 style="margin-top:26px">全部交接紀錄</h2><div class="panel">${table(a.reverse())}</div>`}
function updateNotifications(){if(!current)return;let mine=notifications().filter(n=>n.to===current.username&&!n.read);document.getElementById('notifyCount').textContent=mine.length;document.getElementById('notifyCount').classList.toggle('hidden',mine.length===0);let all=notifications().filter(n=>n.to===current.username).sort((a,b)=>b.id-a.id);document.getElementById('notifyPanel').innerHTML=all.length?all.slice(0,10).map(n=>`<div class="notice-item ${n.read?'':'unread'}" onclick="readNotification(${n.id})"><div class="notice-title">${n.read?'':'🔵 '}${esc(n.message)}</div><div class="notice-time">${esc(n.dept)}｜${esc(n.shift)}｜${esc(n.time)}</div></div>`).join(''):'<div class="notice-item"><div class="muted">目前沒有通知</div></div>'}
function toggleNotifications(){document.getElementById('notifyPanel').classList.toggle('hidden');updateNotifications()}
function readNotification(id){let a=notifications();a=a.map(n=>n.id===id?{...n,read:true}:n);saveNotifications(a);updateNotifications();}
function clearData(){if(confirm('確定清除所有 Demo 交接資料與通知？')){save([]);saveNotifications([]);admin();updateNotifications()}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
