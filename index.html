<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>交接班系統</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f3f6fa;color:#172033}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f2747,#1d5d8f)}.card{background:#fff;border-radius:18px;padding:34px;width:min(440px,92vw);box-shadow:0 18px 50px #0003}.brand{font-size:28px;font-weight:800;margin-bottom:8px}.muted{color:#667085}.field{margin:18px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#1769aa;color:#fff}.btn.secondary{background:#e9eef5;color:#26364a}.btn.danger{background:#d92d20}.top{height:68px;background:#fff;border-bottom:1px solid #e4e7ec;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 68px)}aside{background:#102a43;color:#fff;padding:20px 14px}.nav{padding:12px 14px;border-radius:9px;margin:5px 0;cursor:pointer}.nav.active,.nav:hover{background:#1e4f78}.main{padding:26px;max-width:1400px;width:100%;margin:auto}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:20px;box-shadow:0 2px 8px #00000008}.stat{font-size:30px;font-weight:800;margin-top:6px}.shift{border-left:5px solid #1769aa}.shift h3{margin:0 0 8px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;border-bottom:1px solid #eaecf0;text-align:left;vertical-align:top}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#eaf2ff;color:#175cd3;font-size:12px;font-weight:700}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.notice{padding:12px;border-radius:10px;background:#fff7e6;color:#8a5b00;margin-bottom:15px}.login-help{font-size:12px;line-height:1.7;margin-top:16px;padding:12px;background:#f8fafc;border-radius:10px}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.main{padding:16px}.top{padding:0 16px}}
</style>
</head>
<body>
<section id="login" class="login"><div class="card">
<div class="brand">📋 交接班系統</div><div class="muted">部門分流 × 三班制 × 管理者總覽</div>
<div class="field"><label>帳號</label><input id="username" value="admin" autocomplete="username"></div>
<div class="field"><label>密碼</label><input id="password" type="password" value="admin123" autocomplete="current-password"></div>
<button class="btn" style="width:100%" onclick="login()">登入系統</button>
<div class="login-help"><b>Demo 帳號</b><br>管理者：admin / admin123<br>倉庫：warehouse / 1234<br>拍賣：auction / 1234<br>物流：logistics / 1234<br>資訊：it / 1234</div>
</div></section>
<section id="app" class="hidden"><header class="top"><b>📋 交接班系統</b><div class="row"><span id="userInfo"></span><button class="btn secondary" onclick="logout()">登出</button></div></header><div class="layout"><aside><div class="nav active" onclick="showPage('dashboard',this)">📊 儀表板</div><div class="nav" onclick="showPage('handover',this)">📝 新增交接</div><div class="nav" onclick="showPage('history',this)">🕘 交接紀錄</div><div id="adminNav" class="nav hidden" onclick="showPage('admin',this)">⚙️ 管理者總覽</div></aside><main class="main"><div id="content"></div></main></div></section>
<script>
const USERS={admin:{name:'系統管理者',role:'admin',dept:'全部部門'},warehouse:{name:'倉庫使用者',role:'user',dept:'倉庫部'},auction:{name:'拍賣使用者',role:'user',dept:'拍賣部'},logistics:{name:'物流使用者',role:'user',dept:'物流部'},it:{name:'資訊使用者',role:'user',dept:'資訊部'}};
const shifts=['早班','午班','夜班'];let current=null;
function db(){return JSON.parse(localStorage.getItem('handoverRecords')||'[]')}
function save(a){localStorage.setItem('handoverRecords',JSON.stringify(a))}
function login(){let u=document.getElementById('username').value.trim(),p=document.getElementById('password').value;let x=USERS[u];if(!x||((u==='admin'&&p!=='admin123')||(u!=='admin'&&p!=='1234'))){alert('帳號或密碼錯誤');return}current={username:u,...x};document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('adminNav').classList.toggle('hidden',current.role!=='admin');document.getElementById('userInfo').textContent=`${current.name}｜${current.dept}`;showPage('dashboard',document.querySelector('.nav'))}
function logout(){current=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function visible(){let a=db();return current.role==='admin'?a:a.filter(x=>x.dept===current.dept)}
function showPage(page,el){document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));if(el)el.classList.add('active');if(page==='dashboard')dashboard();if(page==='handover')handover();if(page==='history')history();if(page==='admin')admin()}
function dashboard(){let a=visible(),today=new Date().toLocaleDateString('zh-TW');document.getElementById('content').innerHTML=`<div class="header"><div><h1>儀表板</h1><div class="muted">${current.role==='admin'?'管理者可查看全部部門':'目前顯示：'+current.dept}</div></div><button class="btn" onclick="handover()">＋ 新增交接</button></div><div class="grid"><div class="panel"><div class="muted">今日交接</div><div class="stat">${a.filter(x=>x.date===today).length}</div></div><div class="panel"><div class="muted">早班</div><div class="stat">${a.filter(x=>x.shift==='早班').length}</div></div><div class="panel"><div class="muted">午班 / 夜班</div><div class="stat">${a.filter(x=>x.shift!=='早班').length}</div></div></div><h2 style="margin-top:26px">最近交接</h2><div class="panel">${table(a.slice(-8).reverse())}</div>`}
function handover(){document.getElementById('content').innerHTML=`<div class="header"><div><h1>新增交接</h1><div class="muted">填寫本班重要事項、異常與待辦工作</div></div></div><div class="panel"><div class="formgrid"><div class="field"><label>部門</label><select id="dept" ${current.role==='admin'?'':'disabled'}>${['倉庫部','拍賣部','物流部','資訊部'].map(d=>`<option ${d===(current.role==='admin'?'倉庫部':current.dept)?'selected':''}>${d}</option>`).join('')}</select></div><div class="field"><label>班別</label><select id="shift">${shifts.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="field full"><label>交接事項</label><textarea id="summary" rows="5" placeholder="例如：設備狀況、工作進度、異常事件、重要通知"></textarea></div><div class="field"><label>待辦事項</label><textarea id="todo" rows="4" placeholder="下一班需要處理的工作"></textarea></div><div class="field"><label>異常／注意事項</label><textarea id="issue" rows="4" placeholder="若無可填寫「無」"></textarea></div></div><div class="row"><button class="btn" onclick="submitHandover()">儲存交接</button><button class="btn secondary" onclick="dashboard()">取消</button></div></div>`}
function submitHandover(){let s=document.getElementById('summary').value.trim();if(!s){alert('請填寫交接事項');return}let a=db();a.push({id:Date.now(),date:new Date().toLocaleDateString('zh-TW'),time:new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}),dept:document.getElementById('dept').value,shift:document.getElementById('shift').value,summary:s,todo:document.getElementById('todo').value.trim()||'無',issue:document.getElementById('issue').value.trim()||'無',author:current.name});save(a);alert('交接資料已儲存');dashboard()}
function table(a){if(!a.length)return '<div class="muted">目前沒有交接紀錄</div>';return `<div style="overflow:auto"><table class="table"><thead><tr><th>日期</th><th>部門</th><th>班別</th><th>交接人</th><th>交接事項</th><th>異常</th></tr></thead><tbody>${a.map(x=>`<tr><td>${x.date}<br>${x.time}</td><td>${x.dept}</td><td><span class="badge">${x.shift}</span></td><td>${x.author}</td><td>${esc(x.summary)}<br><small>待辦：${esc(x.todo)}</small></td><td>${esc(x.issue)}</td></tr>`).join('')}</tbody></table></div>`}
function history(){document.getElementById('content').innerHTML=`<div class="header"><div><h1>交接紀錄</h1><div class="muted">${current.role==='admin'?'全部部門':'僅顯示 '+current.dept}</div></div></div><div class="panel">${table(visible().reverse())}</div>`}
function admin(){if(current.role!=='admin')return;let a=db();let stats=['倉庫部','拍賣部','物流部','資訊部'].map(d=>`<div class="panel"><div class="muted">${d}</div><div class="stat">${a.filter(x=>x.dept===d).length}</div></div>`).join('');document.getElementById('content').innerHTML=`<div class="header"><div><h1>管理者總覽</h1><div class="muted">可跨部門查看所有交接資料</div></div><button class="btn danger" onclick="clearData()">清除 Demo 資料</button></div><div class="grid">${stats}</div><h2 style="margin-top:26px">全部交接紀錄</h2><div class="panel">${table(a.reverse())}</div>`}
function clearData(){if(confirm('確定清除所有 Demo 交接資料？')){save([]);admin()}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
</script></body></html>
