<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交接班系統</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f3f6fa;color:#172033}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f2747,#1d5d8f)}.card{background:#fff;border-radius:18px;padding:34px;width:min(480px,92vw);box-shadow:0 18px 50px #0003}.brand{font-size:28px;font-weight:800}.muted{color:#667085}.field{margin:15px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#1769aa;color:#fff}.btn.secondary{background:#e9eef5;color:#26364a}.top{height:68px;background:#fff;border-bottom:1px solid #e4e7ec;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.right{display:flex;align-items:center;gap:12px}.notify{position:relative}.bell{position:relative;border:0;background:#eef4fb;border-radius:10px;padding:9px 12px;font-size:19px;cursor:pointer}.count{position:absolute;right:-5px;top:-6px;background:#d92d20;color:#fff;border-radius:99px;font-size:11px;padding:2px 6px;font-weight:800}.dropdown{position:absolute;right:0;top:48px;width:400px;max-width:90vw;background:#fff;border:1px solid #e4e7ec;border-radius:12px;box-shadow:0 12px 35px #0003;padding:8px;z-index:30;max-height:70vh;overflow:auto}.noticeItem{padding:12px;border-bottom:1px solid #eaecf0;cursor:pointer}.noticeItem.unread{background:#eef6ff}.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 68px)}aside{background:#102a43;color:#fff;padding:20px 14px}.nav{padding:12px 14px;border-radius:9px;margin:5px 0;cursor:pointer}.nav.active,.nav:hover{background:#1e4f78}.main{padding:26px;max-width:1500px;width:100%;margin:auto}.header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:20px;box-shadow:0 2px 8px #00000008}.stat{font-size:30px;font-weight:800;margin-top:6px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid #eaecf0;text-align:left;vertical-align:top}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#eaf2ff;color:#175cd3;font-size:12px;font-weight:700}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.person{padding:14px;border:1px solid #eaecf0;border-radius:10px;margin:8px 0}.marketGrid{display:grid;grid-template-columns:1.3fr 1fr 1fr;border:1px solid #dfe3e8;border-radius:10px;overflow:hidden}.marketGrid>div{padding:10px;border-right:1px solid #dfe3e8;border-bottom:1px solid #dfe3e8}.marketGrid>div:nth-child(3n){border-right:0}.marketHead{font-weight:800;background:#f8fafc}.marketGrid input{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px;text-align:right}.toast{position:fixed;right:20px;bottom:20px;background:#102a43;color:#fff;padding:14px 18px;border-radius:10px;z-index:40}@media(max-width:800px){.layout{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.main{padding:16px}.top{padding:0 16px}.userLabel{display:none}.marketGrid{font-size:13px}}</style></head><body><section id="login" class="login"><div class="card"><div class="brand">📋 交接班系統</div><div class="muted" style="margin-top:6px">蔬果拍賣市場｜三班制 × 部門分流 × 人員交接</div><div class="field"><label>帳號</label><input id="username" value="admin"></div><div class="field"><label>密碼</label><input id="password" type="password" value="admin123"></div><button class="btn" style="width:100%" onclick="login()">登入系統</button><div class="panel" style="margin-top:16px;padding:12px;font-size:12px;line-height:1.7;box-shadow:none"><b>管理者</b>：admin / admin123<br><b>所有部門人員密碼</b>：1234<br>水果：fruit_mgr、fruit_1、fruit_2<br>蔬菜：vegetable_mgr、vegetable_1、vegetable_2</div></div></section><section id="app" class="hidden"><header class="top"><b>📋 交接班系統</b><div class="right"><div class="notify"><button class="bell" onclick="toggleNotify()">🔔<span id="count" class="count hidden">0</span></button><div id="notifyBox" class="dropdown hidden"></div></div><span id="userInfo" class="userLabel"></span><button class="btn secondary" onclick="logout()">登出</button></div></header><div class="layout"><aside><div class="nav active" onclick="page('dashboard',this)">📊 儀表板</div><div class="nav" onclick="page('handover',this)">📝 新增交接</div><div class="nav" onclick="page('history',this)">🕘 交接紀錄</div><div class="nav" onclick="page('people',this)">👥 人員資料</div><div id="adminNav" class="nav hidden" onclick="page('admin',this)">⚙️ 管理者總覽</div></aside><main class="main"><div id="content"></div></main></div></section><div id="toast" class="toast hidden"></div><script>const toastEl=document.getElementById('toast');let token=sessionStorage.getItem('handoverToken')||'',me=null,people=[];const DEPTS=['倉庫部','拍賣部','物流部','資訊部','水果組','蔬菜組'];const MARKET_NAMES=['三重市場','板橋市場','桃農市場','台中市場','西螺市場','高雄市場'];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(token)opt.headers.Authorization='Bearer '+token;const r=await fetch('/api'+path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'系統錯誤');return d}async function login(){try{const d=await api('/login',{method:'POST',body:JSON.stringify({username:username.value.trim(),password:password.value})});token=d.token;sessionStorage.setItem('handoverToken',token);me=d.user;await start()}catch(e){alert(e.message)}}async function start(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('adminNav').classList.toggle('hidden',me.role!=='admin');document.getElementById('userInfo').textContent=`${me.name}｜${me.title}｜${me.dept}`;await loadPeople();await refreshNotify();page('dashboard',document.querySelector('.nav'))}async function loadPeople(){people=await api('/users')}async function logout(){sessionStorage.removeItem('handoverToken');location.reload()}function page(p,el){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));if(el)el.classList.add('active');const f={dashboard,handover,history,people:peoplePage,admin:adminPage}[p];if(f)f()}async function dashboard(){const a=await api('/handovers'),n=await api('/notifications');content.innerHTML=`<div class="header"><div><h1>儀表板</h1><div class="muted">${me.role==='admin'?'管理者可查看全部部門':'目前部門：'+esc(me.dept)}</div></div><button class="btn" onclick="handover()">＋ 新增交接</button></div><div class="grid"><div class="panel"><div class="muted">交接總數</div><div class="stat">${a.length}</div></div><div class="panel"><div class="muted">未讀通知</div><div class="stat">${n.filter(x=>!x.read_at).length}</div></div><div class="panel"><div class="muted">目前可見人員</div><div class="stat">${people.filter(x=>me.role==='admin'||x.dept===me.dept).length}</div></div></div><h2>最近交接</h2><div class="panel">${table(a.slice(0,10))}</div>`}function table(a){if(!a.length)return'<div class="muted">目前沒有交接紀錄</div>';return`<div style="overflow:auto"><table class="table"><thead><tr><th>時間</th><th>部門</th><th>班別</th><th>交接人</th><th>接班人</th><th>交接事項</th><th>本日貢獻度</th><th>各主要批發市場交易行情</th><th>異常</th></tr></thead><tbody>${a.map(x=>{let m={};try{m=JSON.parse(x.market_data||'{}')}catch(e){}const markets=MARKET_NAMES.map(n=>`${n}：${m[n]?.count||'—'} 件／${m[n]?.price||'—'} 元`).join('<br>');return`<tr><td>${new Date(x.created_at).toLocaleString('zh-TW')}</td><td>${esc(x.dept)}</td><td><span class="badge">${esc(x.shift)}</span></td><td>${esc(x.author_name)}<br><small>${esc(x.author_title)}</small></td><td>${esc(x.recipient_name)}<br><small>${esc(x.recipient_title)}</small></td><td>${esc(x.summary)}<br><small>待辦：${esc(x.todo)}</small></td><td>${x.contribution?esc(x.contribution):'—'}</td><td>${markets}</td><td>${esc(x.issue)}</td></tr>`}).join('')}</tbody></table></div>`}function contributionEnabled(d){return d==='水果組'||d==='拍賣部'}function marketGrid(data={}){return`<div class="field full"><label>各主要批發市場交易行情</label><div class="marketGrid"><div class="marketHead">市場</div><div class="marketHead">件數</div><div class="marketHead">價格</div>${MARKET_NAMES.map(n=>`<div>${n}</div><div><input id="count_${n}" type="number" min="0" step="any" placeholder="件數" value="${data[n]?.count??''}"></div><div><input id="price_${n}" type="number" min="0" step="any" placeholder="價格" value="${data[n]?.price??''}"></div>`).join('')}</div><div class="muted" style="font-size:12px;margin-top:5px">件數與價格只填數字，可留白。</div></div>`}function readMarkets(){const o={};for(const n of MARKET_NAMES)o[n]={count:document.getElementById('count_'+n).value.trim(),price:document.getElementById('price_'+n).value.trim()};return o}async function handover(){const d=me.role==='admin'?'水果組':me.dept;content.innerHTML=`<div class="header"><div><h1>新增交接</h1><div class="muted">填寫本班重要事項並指定接班人</div></div></div><div class="panel"><div class="formgrid"><div class="field"><label>部門</label><select id="dept" onchange="refreshRecipients()" ${me.role==='admin'?'':'disabled'}>${DEPTS.map(x=>`<option ${x===d?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>班別</label><select id="shift"><option>早班</option><option>午班</option><option>夜班</option></select></div><div class="field"><label>交接給 *</label><select id="recipient">${recipientOptions(d)}</select></div><div class="field"><label>交接人</label><input disabled value="${esc(me.name)}（${esc(me.title)}）"></div><div id="contributionField" class="field full ${contributionEnabled(d)?'':'hidden'}"><label>本日貢獻度 *</label><textarea id="contribution" rows="3" placeholder="填寫本日貢獻度"></textarea><div class="muted" style="font-size:12px;margin-top:5px">水果組與拍賣部必填。</div></div>${marketGrid()}<div class="field full"><label>交接事項 *</label><textarea id="summary" rows="5" placeholder="設備狀況、工作進度、重要通知"></textarea></div><div class="field"><label>待辦事項</label><textarea id="todo" rows="4"></textarea></div><div class="field"><label>異常／注意事項</label><textarea id="issue" rows="4" placeholder="若無請填無"></textarea></div></div><div class="row"><button class="btn" onclick="submitHandover()">送出交接並通知</button><button class="btn secondary" onclick="dashboard()">取消</button></div></div>`}function recipientOptions(d){return people.filter(x=>x.dept===d&&x.username!==me.username).map(x=>`<option value="${x.id}">${esc(x.name)}｜${esc(x.title)}</option>`).join('')}function refreshRecipients(){const d=document.getElementById('dept').value;document.getElementById('recipient').innerHTML=recipientOptions(d);document.getElementById('contributionField').classList.toggle('hidden',!contributionEnabled(d));if(contributionEnabled(d))document.getElementById('contribution').value=''}async function submitHandover(){try{const d=document.getElementById('dept').value;const body={shift:shift.value,recipient_id:Number(recipient.value),summary:summary.value,todo:todo.value,issue:issue.value,contribution:contributionEnabled(d)?contribution.value:'',market_data:readMarkets()};if(me.role==='admin')body.dept=d;const r=await api('/handovers',{method:'POST',body:JSON.stringify(body)});toast(r.message);await refreshNotify();dashboard()}catch(e){alert(e.message)}}async function history(){const a=await api('/handovers');content.innerHTML=`<div class="header"><div><h1>交接紀錄</h1><div class="muted">${me.role==='admin'?'全部部門':'僅顯示 '+esc(me.dept)}</div></div></div><div class="panel">${table(a)}</div>`}function peoplePage(){const a=people.filter(x=>me.role==='admin'||x.dept===me.dept);content.innerHTML=`<div class="header"><div><h1>人員資料</h1><div class="muted">每個部門 1 名經理＋2 名職員</div></div></div>${DEPTS.filter(d=>me.role==='admin'||d===me.dept).map(d=>`<div class="panel"><h2>${d}</h2>${a.filter(x=>x.dept===d).map(x=>`<div class="person"><b>${esc(x.name)}</b><br><span class="muted">${esc(x.title)}｜帳號：${esc(x.username)}</span></div>`).join('')}</div>`).join('')}`}async function adminPage(){const a=await api('/handovers');content.innerHTML=`<div class="header"><div><h1>管理者總覽</h1><div class="muted">可查看全部 ${DEPTS.length} 個部門</div></div></div><div class="grid">${DEPTS.map(d=>`<div class="panel"><div class="muted">${d}</div><div class="stat">${people.filter(x=>x.dept===d).length} 人</div></div>`).join('')}</div><h2>全部交接紀錄</h2><div class="panel">${table(a)}</div>`}async function refreshNotify(){try{const a=await api('/notifications'),un=a.filter(x=>!x.read_at);count.textContent=un.length;count.classList.toggle('hidden',!un.length);return a}catch(e){return[]}}async function toggleNotify(){const a=await refreshNotify();notifyBox.innerHTML=a.length?a.map(x=>`<div class="noticeItem ${x.read_at?'':'unread'}" onclick="readNotify(${x.id})"><b>${x.read_at?'':'🔵 '}${esc(x.message)}</b><br><small>${new Date(x.created_at).toLocaleString('zh-TW')}</small><p>${esc(x.summary)}</p>${x.contribution?`<small>本日貢獻度：${esc(x.contribution)}</small>`:''}</div>`).join(''):'<div class="muted" style="padding:16px">目前沒有通知</div>';notifyBox.classList.toggle('hidden')}async function readNotify(id){await api('/notifications/'+id+'/read',{method:'POST'});await toggleNotify();await refreshNotify()}function toast(s){toastEl.textContent=s;toastEl.classList.remove('hidden');setTimeout(()=>toastEl.classList.add('hidden'),3000)}setInterval(refreshNotify,15000);async function boot(){if(!token)return;try{const d=await api('/me');me=d.user;await start()}catch(e){sessionStorage.removeItem('handoverToken');token=''}}boot();</script></body></html>
