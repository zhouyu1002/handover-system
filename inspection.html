<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巡檢系統</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f3f6fa;color:#172033}.top{background:#fff;border-bottom:1px solid #e4e7ec;padding:16px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.wrap{max-width:1250px;margin:auto;padding:24px}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:#1769aa;color:#fff}.btn.secondary{background:#e9eef5;color:#26364a}.muted{color:#667085}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:20px;box-shadow:0 2px 8px #00000008}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field select,.field input,.field textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:9px}.photo{width:100%;height:200px;object-fit:cover;border-radius:10px;background:#eef2f6}.ok{display:inline-block;padding:4px 8px;border-radius:999px;background:#ecfdf3;color:#027a48;font-size:12px;font-weight:700}.bad{display:inline-block;padding:4px 8px;border-radius:999px;background:#fef3f2;color:#b42318;font-size:12px;font-weight:700}@media(max-width:850px){.grid{grid-template-columns:1fr}.wrap{padding:15px}}</style></head><body><header class="top"><div><b>📸 巡檢系統</b><div id="userInfo" class="muted"></div></div><div><button class="btn secondary" onclick="location.href='/floorplan.html'">🗺️ 圖面</button> <button class="btn secondary" onclick="location.href='/portal.html'">回作業平台</button></div></header><main class="wrap"><div class="panel" style="margin-bottom:18px"><h1 style="margin-top:0">設備巡檢</h1><div class="muted">每次巡檢需拍照並由系統記錄打卡時間；異常設備請填寫說明。可從「圖面」進入平面圖與巡檢點定位。</div></div><div id="notice"></div><div id="checkpoints" class="grid"></div><section class="panel" style="margin-top:18px"><h2>最近巡檢紀錄</h2><div id="records"></div></section></main><script>let token=sessionStorage.getItem('handoverToken')||'',me=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(token)opt.headers.Authorization='Bearer '+token;const r=await fetch('/api'+path,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'系統錯誤');return d}async function boot(){try{const m=await api('/me');me=m.user;userInfo.textContent=`${me.name}｜${me.title}｜${me.dept}`;if(me.role!=='admin'&&!me.canInspection)throw Error('目前帳號沒有巡檢系統權限');if(me.role==='admin')document.getElementById('notice').innerHTML='<div class="panel">💡 系統管理者可進入「圖面」管理巡檢圖面與位置。</div>';await load()}catch(e){document.querySelector('.wrap').innerHTML=`<div class="panel"><h2>無法進入巡檢系統</h2><p>${esc(e.message)}</p><button class="btn secondary" onclick="location.href='/portal.html'">返回作業平台</button></div>`}}async function load(){const cps=await api('/inspection/checkpoints');checkpoints.innerHTML=cps.length?cps.map(c=>card(c)).join(''):'<div class="panel">目前沒有可巡檢設備，請系統管理員先建立巡檢點。</div>';const r=await api('/inspection/records');records.innerHTML=r.length?`<div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><tr><th style="text-align:left;padding:8px">時間</th><th style="text-align:left;padding:8px">設備</th><th style="text-align:left;padding:8px">結果</th><th style="text-align:left;padding:8px">說明</th><th style="text-align:left;padding:8px">照片</th></tr>${r.map(x=>`<tr><td style="padding:8px;border-top:1px solid #eee">${new Date(x.checked_at).toLocaleString('zh-TW')}</td><td style="padding:8px;border-top:1px solid #eee">${esc(x.checkpoint_name)}<br><small>${esc(x.location||'')}</small></td><td style="padding:8px;border-top:1px solid #eee">${x.result==='正常'?'<span class="ok">正常</span>':'<span class="bad">異常</span>'}</td><td style="padding:8px;border-top:1px solid #eee">${esc(x.note)}</td><td style="padding:8px;border-top:1px solid #eee">${x.photo_file?`<a href="/inspection_uploads/${encodeURIComponent(x.photo_file)}" target="_blank">查看</a>`:'—'}</td></tr>`).join('')}</table></div>`:'<div class="muted">目前沒有巡檢紀錄。</div>'}function card(c){return`<div class="panel"><h2 style="margin-top:0">${esc(c.name)}</h2><div class="muted">${esc(c.dept)}｜${esc(c.location||'')}</div><p>${esc(c.description||'')}</p><form onsubmit="submitCheck(event,${c.id})"><div class="field"><label>巡檢結果</label><select name="result"><option>正常</option><option>異常</option></select></div><div class="field"><label>照片（必填）</label><input name="photo" type="file" accept="image/*" capture="environment" required onchange="preview(this,${c.id})"></div><img id="preview_${c.id}" class="photo" style="display:none"><div class="field"><label>巡檢說明</label><textarea name="note" rows="3" placeholder="異常原因、處置狀況或備註"></textarea></div><input name="lat" type="hidden"><input name="lng" type="hidden"><button class="btn" type="button" onclick="getLocation(${c.id},this.form)">📍 取得定位</button> <button class="btn" type="submit">📸 拍照並打卡</button><div id="status_${c.id}" class="muted" style="margin-top:8px"></div></form></div>`}function preview(input,id){const file=input.files[0],img=document.getElementById('preview_'+id);if(!file){img.style.display='none';return}img.src=URL.createObjectURL(file);img.style.display='block'}function getLocation(id,form){if(!navigator.geolocation)return alert('此裝置不支援定位');navigator.geolocation.getCurrentPosition(p=>{form.lat.value=p.coords.latitude;form.lng.value=p.coords.longitude;document.getElementById('status_'+id).textContent='已取得目前定位'},()=>alert('無法取得定位，可直接提交巡檢'))}async function submitCheck(e,id){e.preventDefault();const form=e.target;const fd=new FormData(form);fd.append('checkpoint_id',id);try{document.getElementById('status_'+id).textContent='上傳中...';const r=await fetch('/api/inspection/records',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});const d=await r.json();if(!r.ok)throw Error(d.error||'巡檢失敗');alert('巡檢完成：'+d.message);form.reset();document.getElementById('preview_'+id).style.display='none';await load()}catch(err){alert(err.message)}}boot();</script></body></html>
